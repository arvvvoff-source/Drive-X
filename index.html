<!DOCTYPE html>
<html lang="hy">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ավտոդպրոց</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f6f8;
      color: #111827;
    }

    .app {
      max-width: 500px;
      margin: auto;
      min-height: 100vh;
      padding: 20px;
    }

    .header {
      margin-top: 10px;
      margin-bottom: 25px;
    }

    .logo {
      font-size: 42px;
      margin-bottom: 8px;
    }

    .title {
      font-size: 30px;
      font-weight: 800;
    }

    .subtitle {
      margin-top: 6px;
      color: #6b7280;
      font-size: 15px;
    }

    .main-btn {
      width: 100%;
      border: none;
      border-radius: 18px;
      padding: 19px;
      background: #111827;
      color: white;
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 18px;
      cursor: pointer;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 20px 15px;
      min-height: 120px;
      border: 1px solid #e5e7eb;
      cursor: pointer;
    }

    .icon {
      font-size: 30px;
      margin-bottom: 12px;
    }

    .card-title {
      font-weight: 700;
      font-size: 15px;
    }

    .card-text {
      color: #6b7280;
      font-size: 12px;
      margin-top: 5px;
    }

    .stats {
      background: white;
      border-radius: 18px;
      padding: 18px;
      margin-top: 12px;
      border: 1px solid #e5e7eb;
    }

    .stats-title {
      font-weight: 700;
      margin-bottom: 14px;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
      color: #6b7280;
    }

    .stat-value {
      color: #111827;
      font-weight: 700;
    }

    .screen {
      display: none;
    }

    .back {
      border: none;
      background: transparent;
      font-size: 16px;
      margin-bottom: 20px;
      cursor: pointer;
    }

    .question {
      background: white;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 15px;
    }

    .question-number {
      color: #6b7280;
      font-size: 13px;
      margin-bottom: 12px;
    }

    .question-text {
      font-size: 18px;
      font-weight: 700;
      line-height: 1.4;
    }

    .answer {
      width: 100%;
      padding: 16px;
      margin-top: 10px;
      border: 1px solid #e5e7eb;
      background: white;
      border-radius: 14px;
      text-align: left;
      font-size: 15px;
      cursor: pointer;
    }

    .answer:hover {
      background: #f3f4f6;
    }
  </style>
</head>

<body>

<div class="app">

  <!-- ԳԼԽԱՎՈՐ -->
  <div id="home" class="screen" style="display:block">

    <div class="header">
      <div class="logo">🚗</div>
      <div class="title">Ավտոդպրոց</div>
      <div class="subtitle">
        Պատրաստվիր վարորդական տեսական քննությանը
      </div>
    </div>

    <button class="main-btn" onclick="startTest()">
      📝 Սկսել փորձնական քննություն
    </button>

    <div class="grid">

      <div class="card" onclick="alert('Շուտով')">
        <div class="icon">📚</div>
        <div class="card-title">Հարցեր</div>
        <div class="card-text">Սովորիր հարցերով</div>
      </div>

      <div class="card" onclick="alert('Շուտով')">
        <div class="icon">🚦</div>
        <div class="card-title">Նշաններ</div>
        <div class="card-text">Ճանապարհային նշաններ</div>
      </div>

      <div class="card" onclick="alert('Շուտով')">
        <div class="icon">❌</div>
        <div class="card-title">Իմ սխալները</div>
        <div class="card-text">Կրկնիր սխալ հարցերը</div>
      </div>

      <div class="card" onclick="alert('Շուտով')">
        <div class="icon">📊</div>
        <div class="card-title">Արդյունքներ</div>
        <div class="card-text">Տես առաջընթացդ</div>
      </div>

    </div>

    <div class="stats">

      <div class="stats-title">
        📈 Քո առաջընթացը
      </div>

      <div class="stat-row">
        <span>Լուծված հարցեր</span>
        <span class="stat-value">0</span>
      </div>

      <div class="stat-row">
        <span>Ճիշտ պատասխաններ</span>
        <span class="stat-value">0%</span>
      </div>

    </div>

  </div>


  <!-- ՔՆՆՈՒԹՅՈՒՆ -->

  <div id="test" class="screen">

    <button class="back" onclick="goHome()">
      ← Գլխավոր
    </button>

    <div class="question">

      <div class="question-number" id="questionNumber">
        Հարց 1 / 3
      </div>

      <div class="question-text" id="questionText">
      </div>

    </div>

    <div id="answers"></div>

  </div>

</div>


<script>

const questions = [

  {
    question:
      "Նշաններից ո՞րն է կոչվում «Արգելքի շրջանցումը ձախից»։",

    answers: [
      "1",
      "2",
      "3",
      "4",
      "5"
    ],

    correct: 2
  },

  {
    question:
      "Թույլատրվու՞մ է արդյոք ավտոբուսի վարորդին մուտք գործել խաչմերուկ տվյալ իրադրությունում։",

    answers: [
      "Թույլատրվում է։",
      "Արգելվում է։",
      "Թույլատրվում է, եթե ավտոբուսը երթևեկում է սահմանված երթուղով։"
    ],

    correct: 1
  },

  {
    question:
      "Ո՞ր գոտուց պետք է կատարվի աջ շրջադարձը։",

    answers: [
      "Միայն երկրորդ գոտուց։",
      "Միայն աջ եզրային գոտուց։"
    ],

    correct: 1
  }

];


let currentQuestion = 0;


function startTest() {

  currentQuestion = 0;

  document.getElementById("home").style.display = "none";
  document.getElementById("test").style.display = "block";

  showQuestion();

}


function showQuestion() {

  const q = questions[currentQuestion];

  document.getElementById("questionNumber").innerText =
    `Հարց ${currentQuestion + 1} / ${questions.length}`;

  document.getElementById("questionText").innerText =
    q.question;

  const answers = document.getElementById("answers");

  answers.innerHTML = "";

  q.answers.forEach((answer, index) => {

    const button = document.createElement("button");

    button.className = "answer";

    button.innerText =
      `${String.fromCharCode(65 + index)}) ${answer}`;

    button.onclick = () => checkAnswer(index);

    answers.appendChild(button);

  });

}


function checkAnswer(index) {

  const q = questions[currentQuestion];

  if (index === q.correct) {

    alert("✅ Ճիշտ պատասխան");

  } else {

    alert(
      `❌ Սխալ պատասխան\n\nՃիշտ պատասխան՝ ${
        String.fromCharCode(65 + q.correct)
      }`
    );

  }

  currentQuestion++;

  if (currentQuestion >= questions.length) {

    alert("🏁 Փորձնական քննությունն ավարտվեց!");

    goHome();

  } else {

    showQuestion();

  }

}


function goHome() {

  document.getElementById("test").style.display = "none";
  document.getElementById("home").style.display = "block";

}

</script>

</body>
</html>
